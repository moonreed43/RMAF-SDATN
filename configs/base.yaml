include: [data.yaml, model.yaml, training.yaml]
experiment:
  name: main
  targets: [H7, H8, G5, G7]
  transfers: [mixed, intra, inter]
  budgets: [1, 3, 7, 14, 30]
  methods: [rmaf, persistence, target_only, multi_source, dann, mmd, coral]
  output: outputs
  variants:
    full: {}
  analysis: standard
  keep_going: false
evaluation:
  active_threshold: 0.05
  ramp_quantile: 0.90
  diagnostic_samples: 256
  latency_warmup: 10
  latency_repeats: 50
  figure_days: 3
  merge_atol: 0.00001
  merge_rtol: 0.00001
